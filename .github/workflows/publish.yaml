name: Publish
on:
    push:
        branches:
            - master
            - develop

jobs:
    publish:
        runs-on: ubuntu-latest
        # Required for npm OIDC trusted publishing: lets the job mint a
        # short-lived OIDC token that npm verifies against the trusted
        # publisher configured for this package. No NPM_TOKEN secret needed.
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  # npm OIDC trusted publishing requires Node 20.17+/22.9+.
                  node-version: 22
                  cache: "yarn"
                  registry-url: "https://registry.npmjs.org"
            # Trusted publishing requires npm >= 11.5.1; Node 22 ships an older
            # npm, so upgrade the global npm used for `npm publish`.
            - name: Upgrade npm
              run: npm install -g npm@latest

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build:prod

            - name: Test
              run: yarn test --detectOpenHandles --forceExit

            - name: Setup Custom Contexts
              shell: bash
              run: |
                  echo "branch=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT
                  echo "version=$(cat ./package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')" >> $GITHUB_OUTPUT
                  echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
              id: job_context

            - name: Make snapshot version
              if: steps.job_context.outputs.branch != 'master'
              run: |
                  npm version prerelease --preid=${{ steps.job_context.outputs.short_sha }} --git-tag-version false

            # With trusted publishing, npm authenticates via OIDC automatically
            # and generates provenance — no token env var required.
            - name: Publish package to latest
              if: steps.job_context.outputs.branch == 'master'
              run: npm publish --ignore-scripts --access public

            - name: Publish package to branch-tag
              if: steps.job_context.outputs.branch != 'master'
              run: npm publish --ignore-scripts --access public --tag $(echo "develop-${{ steps.job_context.outputs.version }}-rc" | sed 's/[.]//g')
