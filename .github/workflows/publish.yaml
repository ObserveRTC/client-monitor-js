name: Publish

# A push to master publishes `latest`. Every branch with an open pull request against master
# publishes a snapshot on each push to it, so a consumer can try a change before it lands.
#
# `develop` is not listed: it gets snapshots through its own pull request, like any other
# branch. Listing it here as well would fire both triggers for the same commit and publish
# two snapshots of it.
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    publish:
        runs-on: ubuntu-latest
        # Required for npm OIDC trusted publishing: lets the job mint a
        # short-lived OIDC token that npm verifies against the trusted
        # publisher configured for this package. No NPM_TOKEN secret needed.
        permissions:
            id-token: write
            contents: read
        steps:
            # On a pull request this checks out the merge commit, so a snapshot is built from
            # the branch as it would land on master rather than from the branch alone.
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  # npm OIDC trusted publishing requires Node 20.17+/22.9+.
                  node-version: 22
                  cache: "yarn"
                  registry-url: "https://registry.npmjs.org"
            # Trusted publishing requires npm >= 11.5.1; Node 22 ships an older
            # npm, so upgrade the global npm used for `npm publish`.
            - name: Upgrade npm
              run: npm install -g npm@latest

            - name: Diagnostics
              # npm OIDC trusted publishing needs npm >= 11.5.1 and an OIDC
              # token request URL (present only when id-token: write is granted).
              run: |
                  echo "node: $(node --version)"
                  echo "npm:  $(npm --version)"
                  if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                      echo "OIDC: available"
                  else
                      echo "::warning::OIDC token URL not present — id-token permission missing or OIDC unavailable."
                  fi

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build:prod

            - name: Test
              run: yarn test --detectOpenHandles --forceExit

            # `GITHUB_REF` is `refs/pull/<number>/merge` on a pull request run, so the branch
            # name it used to be cut from read as "merge" there. The event is what actually
            # says which kind of release this is, and it needs no parsing.
            - name: Setup Custom Contexts
              shell: bash
              env:
                  IS_SNAPSHOT: ${{ github.event_name == 'pull_request' }}
              run: |
                  echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
                  echo "package=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
                  echo "snapshot=$IS_SNAPSHOT" >> $GITHUB_OUTPUT
              id: job_context

            # Snapshot versions are X.Y.Z-rc.<run_number>.
            #
            # The prerelease identifier MUST increase monotonically. Semver
            # compares prerelease identifiers as ASCII strings, and git SHAs have
            # no chronological order, so the previous scheme (X.Y.Z-<sha>.0) made
            # the "highest" RC effectively random: of the nine 4.7.1 RCs, the
            # newest by publish time (4.7.1-28d5bf5.0) was the LOWEST by semver
            # precedence, because "2" sorts below every other leading character.
            # Consumers on `^4.7.1-28d5bf5.0` silently resolved to an older build
            # and `yarn up` could never move them off it.
            #
            # github.run_number is strictly increasing per workflow, and semver
            # compares all-numeric identifiers numerically (rc.9 < rc.10), so
            # `rc.<run_number>` orders by build order. It is also per workflow
            # rather than per branch, so snapshots of two branches open at once
            # still order by build order between them.
            #
            # "rc" is also chosen so the first publish under this scheme sorts
            # ABOVE the highest SHA-based RC already published (4.7.1-ee698a7.0):
            # 'r' > 'e', so any rc.N beats every legacy SHA RC and consumers with
            # existing ranges can see it. "dev"/"alpha"/"beta" would have sorted
            # BELOW it and been invisible.
            #
            # Build metadata (X.Y.Z-rc.N+<sha>) is deliberately NOT used to carry
            # the SHA: semver treats versions differing only in build metadata as
            # equal and npm rejects the second publish as a duplicate. npm already
            # records the commit in the published `gitHead` field.
            - name: Make snapshot version
              if: steps.job_context.outputs.snapshot == 'true'
              env:
                  BASE_VERSION: ${{ steps.job_context.outputs.version }}
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  RC_VERSION="$(node -e '
                    const base = process.env.BASE_VERSION
                    const [core, pre] = base.split("-")
                    const [major, minor, patch] = core.split(".").map(Number)
                    // A stable base (4.7.0) targets the next patch (4.7.1); a base
                    // that is already a prerelease (4.7.1-rc.3) keeps its own patch.
                    const target = pre ? core : [major, minor, patch + 1].join(".")
                    process.stdout.write(target + "-rc." + process.env.RUN_NUMBER)
                  ')"
                  echo "Publishing snapshot $RC_VERSION"
                  npm version "$RC_VERSION" --git-tag-version false
                  echo "rc_version=$RC_VERSION" >> $GITHUB_OUTPUT
              id: rc_version

            # With trusted publishing, npm authenticates via OIDC automatically
            # and generates provenance — no token env var required.
            - name: Publish package to latest
              if: steps.job_context.outputs.snapshot != 'true'
              run: npm publish --ignore-scripts --access public

            # `next` is the stable, moving tag consumers should depend on: it
            # always points at the newest snapshot across all branches, so a
            # dependency of "next" never has to be edited when the line bumps.
            #
            # It is the ONLY tag a snapshot sets, deliberately. `npm publish` takes one
            # `--tag` and sets it atomically over the OIDC identity it mints internally.
            # Any second tag is a second registry write, and `npm dist-tag` has no OIDC
            # code path -- it would need either a hand-minted token or the NPM_TOKEN
            # secret that trusted publishing exists to remove. A per-branch tag is worth
            # neither: the run summary prints the exact `X.Y.Z-rc.N` to install when a
            # consumer wants one branch's build rather than the newest one.
            - name: Publish the snapshot to the next tag
              if: steps.job_context.outputs.snapshot == 'true'
              run: npm publish --ignore-scripts --access public --tag next

            - name: Summarise the snapshot
              if: steps.job_context.outputs.snapshot == 'true'
              env:
                  PACKAGE: ${{ steps.job_context.outputs.package }}
                  RC_VERSION: ${{ steps.rc_version.outputs.rc_version }}
              run: |
                  {
                      echo "### Snapshot published"
                      echo
                      echo '```sh'
                      echo "yarn add $PACKAGE@$RC_VERSION   # this build"
                      echo "yarn add $PACKAGE@next          # newest snapshot, any branch"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
