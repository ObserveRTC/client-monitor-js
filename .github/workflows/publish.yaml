name: Publish
on:
    push:
        branches:
            - master
            - develop

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: "yarn"
                  # Writes an .npmrc that authenticates against the public npm
                  # registry using the NODE_AUTH_TOKEN env var at publish time.
                  registry-url: "https://registry.npmjs.org"
            - name: Install
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build:prod

            - name: Test
              run: yarn test --detectOpenHandles --forceExit

            - name: Verify npm auth
              # Fail fast with a clear message instead of npm's misleading
              # "404 Not Found" that it returns for scoped packages when the
              # token is missing or lacks publish access.
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                      echo "::error::NPM_TOKEN secret is empty or unset — cannot authenticate to npm."
                      exit 1
                  fi
                  npm whoami
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Setup Custom Contexts
              shell: bash
              run: |
                  echo "branch=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT
                  echo "version=$(cat ./package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')" >> $GITHUB_OUTPUT
                  echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
              id: job_context

            - name: Make snapshot version
              if: steps.job_context.outputs.branch != 'master'
              run: |
                  npm version prerelease --preid=${{ steps.job_context.outputs.short_sha }} --git-tag-version false

            - name: Publish package to latest
              if: steps.job_context.outputs.branch == 'master'
              run: npm publish --ignore-scripts --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish package to branch-tag
              if: steps.job_context.outputs.branch != 'master'
              run: npm publish --ignore-scripts --access public --tag $(echo "develop-${{ steps.job_context.outputs.version }}-rc" | sed 's/[.]//g')
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
